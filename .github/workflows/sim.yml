name: sim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nvc:
    name: nvc testbenches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup nvc
        uses: nickg/setup-nvc@48f966dfc9b27bf13e873a473fcf1649ef8f5a0f # v1
        with:
          version: "1.22.1"

      - name: Show nvc version
        run: nvc --version

      - name: Run assertion testbenches
        run: bash scripts/sim.sh

  ghdl:
    name: ghdl cross-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Installed straight from the immutable v6.0.0 release; the mcode
      # build locates its libraries relative to the binary, so extracting
      # anywhere and adding bin/ to PATH is enough.
      - name: Install GHDL
        run: |
          curl -sL -o /tmp/ghdl.tgz \
            https://github.com/ghdl/ghdl/releases/download/v6.0.0/ghdl-mcode-6.0.0-ubuntu24.04-x86_64.tar.gz
          mkdir -p "$RUNNER_TEMP/ghdl"
          tar -xzf /tmp/ghdl.tgz -C "$RUNNER_TEMP/ghdl" --strip-components=1
          echo "$RUNNER_TEMP/ghdl/bin" >> "$GITHUB_PATH"

      - name: Show GHDL version
        run: ghdl --version

      - name: Run assertion testbenches
        run: SIM=ghdl bash scripts/sim.sh
